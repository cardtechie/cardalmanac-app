name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The upstream gitleaks-action requires a paid GITLEAKS_LICENSE for
      # organization-owned repositories, so this runs the pinned upstream image
      # directly instead. Same binary, same config, no licensing coupling.
      #
      # `dir` scans the working tree only, never history: the production APP_KEY
      # rotated in #430 is still present in four years of commits and is
      # deliberately not being rewritten out, so a history-wide scan would fail
      # forever on a key that is already dead.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.28.0 \
            dir /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
