name: Deploy

on:
  deployment:

env:
  SERVICE_NAME: cardalmanac-app
  VERSION: ${{ github.event.deployment.ref }}

jobs:
  deploy-version:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: avakar/set-deployment-status@v1
        name: "Deployment: In Progress"
        with:
          deployment_id: ${{ github.event.deployment.id }}
          state: in_progress
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.CARDALMANAC_APP_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v2

  docker-tag-latest:
    name: Tag docker image
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - env:
          NEW_TAG: latest
        run: |
          docker pull picklewagon/${SERVICE_NAME:?}:${VERSION:?}
          docker tag picklewagon/${SERVICE_NAME}:${VERSION} picklewagon/${SERVICE_NAME}:${NEW_TAG}
          docker push picklewagon/${SERVICE_NAME}:${NEW_TAG}

  update-status:
    name: Update deployment status
    runs-on: ubuntu-latest
    needs: docker-tag-release
    steps:
      - uses: avakar/set-deployment-status@v1
        name: "Deployment: Failed"
        if: failure()
        with:
          deployment_id: ${{ github.event.deployment.id }}
          state: failure
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.CARDALMANAC_APP_TOKEN }}

      - uses: avakar/set-deployment-status@v1
        name: "Deployment: Success"
        if: success()
        with:
          deployment_id: ${{ github.event.deployment.id }}
          state: success
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.CARDALMANAC_APP_TOKEN }}
