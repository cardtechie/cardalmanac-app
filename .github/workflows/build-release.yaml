name: Build Release

on:
  push:
    branches:
      - main

env:
  SERVICE_NAME: cardalmanac-app
  DOCKER_BUILDKIT: 1

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # Fetch full history for version calculation
      - name: Calculate Next Version
        id: version
        run: |
          # Make version script executable and calculate next version
          chmod +x build/version.sh
          VERSION=$(./build/version.sh next)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Next release version: $VERSION"
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          install: true
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          tags: "picklewagon/${{ env.SERVICE_NAME }}:${{ env.VERSION }}"
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          # Passed as a BuildKit secret, not a build-arg: `docker history`
          # renders ARG values in plaintext, and this image is published.
          secrets: |
            composer_token=${{ secrets.COMPOSER_TOKEN }}
      - name: Set Release Version
        run: |
          echo "RELEASE_VERSION=${{ env.VERSION }}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${{ env.VERSION }}" >> $GITHUB_ENV
      - name: Generate Release Notes
        run: |
          # Make release scripts executable
          chmod +x build/*.sh
          # Generate release notes using our automation system (without AI to avoid API key dependency)
          ./build/generate-release-notes.sh --format github --no-ai ${{ env.VERSION }} > release_notes.md
      - name: Create Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.CARDALMANAC_APP_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: "Release ${{ env.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: false

  trigger-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: avakar/create-deployment@8711a60d47672e4d77a3d1298802410a9edc877e # v1.0.2
        id: deployment
        with:
          ref: ${{ needs.create-release.outputs.version }}
          auto_merge: false
          environment: production
          transient_environment: true
          required_contexts: ""
        env:
          GITHUB_TOKEN: ${{ secrets.CARDALMANAC_APP_TOKEN }}
      - uses: avakar/set-deployment-status@578b982d2ad5f56e50864f9e21ec354a073cd6f5 # v1.1.0
        with:
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          state: queued
        env:
          GITHUB_TOKEN: ${{ secrets.CARDALMANAC_APP_TOKEN }}
