name: Build Release

on:
  push:
    branches:
      - main

env:
  SERVICE_NAME: cardalmanac-app
  DOCKER_BUILDKIT: 1

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch full history for version calculation
      - name: Calculate Next Version
        id: version
        run: |
          # Make version script executable and calculate next version
          chmod +x build/version.sh
          VERSION=$(./build/version.sh next)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Next release version: $VERSION"
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Image
        uses: docker/build-push-action@v4
        with:
          builder: ${{ steps.buildx.outputs.name }}
          tags: "picklewagon/${{ env.SERVICE_NAME }}:${{ env.VERSION }}"
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMPOSER_TOKEN=${{ secrets.COMPOSER_TOKEN }}
      - name: Set Release Version
        run: |
          echo "RELEASE_VERSION=${{ env.VERSION }}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${{ env.VERSION }}" >> $GITHUB_ENV
      - name: Generate Release Notes
        run: |
          # Make release scripts executable
          chmod +x build/*.sh
          # Generate release notes using our automation system (without AI to avoid API key dependency)
          ./build/generate-release-notes.sh --format github --no-ai ${{ env.VERSION }} > release_notes.md
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.CARDALMANAC_APP_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: "Release ${{ env.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: false

  trigger-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: avakar/create-deployment@v1
        id: deployment
        with:
          ref: ${{ needs.create-release.outputs.version }}
          auto_merge: false
          environment: production
          transient_environment: true
          required_contexts: ""
        env:
          GITHUB_TOKEN: ${{ secrets.CARDALMANAC_APP_TOKEN }}
      - uses: avakar/set-deployment-status@v1
        with:
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          state: queued
        env:
          GITHUB_TOKEN: ${{ secrets.CARDALMANAC_APP_TOKEN }}
