name: Build and Test

on:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      # The build only pulls public base images and pushes nothing (push: false),
      # so a failed login must never fail the job. Dependabot-triggered runs read
      # from a separate secret store whose credentials are stale.
      - name: Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          install: true
      - name: Build docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./
          builder: ${{ steps.buildx.outputs.name }}
          file: Dockerfile
          push: false
          load: true
          tags: picklewagon/cardalmanac-app:test
      - name: Run test suite
        run: DOCKER_TAG_CAAPP=test docker compose -f .docker/tests.docker-compose.yaml run caapp npm test
