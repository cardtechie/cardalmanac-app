name: Build and Test

on:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build Docker Image
        run: docker-compose build caapp
      - name: PHP Linter
        run: docker-compose -f .docker/tests.docker-compose.yaml run caapp composer lint
