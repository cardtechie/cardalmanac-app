name: Build and Test

on:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true
      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: ./
          builder: ${{ steps.buildx.outputs.name }}
          file: Dockerfile
          # The test suite needs the dev toolchain: `npm test` runs prettier out
          # of node_modules and `composer lint` out of the dev vendor tree, and
          # tests.entrypoint.sh runs `composer dump-autoload`. None of that
          # exists in the shipped `runtime` stage.
          target: dev
          push: false
          load: true
          tags: picklewagon/cardalmanac-app:test
          # Passed as a BuildKit secret, not a build-arg: `docker history`
          # renders ARG values in plaintext.
          secrets: |
            composer_token=${{ secrets.COMPOSER_TOKEN }}
      - name: Run test suite
        run: DOCKER_TAG_CAAPP=test docker compose -f .docker/tests.docker-compose.yaml run caapp npm test
