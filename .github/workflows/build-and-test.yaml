name: Build and Test

on:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # The build only pulls public base images and pushes nothing (push: false),
      # so a failed login must never fail the job. Dependabot-triggered runs read
      # from a separate secret store whose credentials are stale.
      - name: Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true
      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: ./
          builder: ${{ steps.buildx.outputs.name }}
          file: Dockerfile
          push: false
          load: true
          tags: picklewagon/cardalmanac-app:test
      - name: Run test suite
        run: DOCKER_TAG_CAAPP=test docker compose -f .docker/tests.docker-compose.yaml run caapp npm test
