# Issue Branch Configuration for Card Almanac
# Automatically creates branches for issues based on labels

# Branch naming pattern: {prefix}{issue.number}-{sanitized-title}
branchName: "${issue.number}-${issue.title,}"
autoCloseIssue: false  # Don't auto-close, let PR handle it
gitSafeReplacementChar: "-"
maxLength: 50  # Keep branch names reasonable

# Branch type mapping based on issue labels
branches:
  # Bug fixes and hotfixes
  - label: "type: bug"
    prefix: hotfix/
  - label: bug  # Legacy support
    prefix: hotfix/
  - label: "type: security"
    prefix: hotfix/
  - label: "priority: critical"
    prefix: hotfix/
    
  # Features and enhancements  
  - label: "type: feature"
    prefix: feature/
  - label: "type: enhancement"
    prefix: feature/
  - label: enhancement  # Legacy support
    prefix: feature/
  - label: "area: cards"
    prefix: feature/
  - label: "area: sets"
    prefix: feature/
  - label: "area: search"
    prefix: feature/
  - label: "area: authentication"
    prefix: feature/
  - label: "area: admin"
    prefix: feature/
  - label: "area: api"
    prefix: feature/
  - label: "area: ui/ux"
    prefix: feature/
  - label: "area: reporting"
    prefix: feature/
  - label: "area: notifications"
    prefix: feature/
    
  # Maintenance and technical work
  - label: "type: maintenance"
    prefix: chore/
  - label: "type: performance"
    prefix: chore/
  - label: "component: build"
    prefix: chore/
  - label: "component: ci/cd"
    prefix: chore/
  - label: "component: testing"
    prefix: chore/
  - label: dependencies
    prefix: chore/
  - label: "data: migration"
    prefix: chore/
    
  # Documentation
  - label: "type: documentation"
    prefix: docs/
  - label: content  # Legacy support
    prefix: docs/
    
  # Environment-specific issues
  - label: "env: production"
    prefix: hotfix/
  - label: "env: staging"
    prefix: fix/
  - label: "env: development"
    prefix: fix/
    
  # Component-specific branches
  - label: "component: frontend"
    prefix: feature/
  - label: "component: backend"
    prefix: feature/
  - label: "component: database"
    prefix: feature/
  - label: "component: docker"
    prefix: chore/
    
  # Default fallback - create feature branch for anything else
  - label: "*"
    prefix: feature/
