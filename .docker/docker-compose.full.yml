services:
  caapp:
    environment:
      TRADINGCARDAPI_URL: "https://tcapi:443"
    ports:
      - "${CAAPP_PORT_DEBUG:-9001}:9001"
    depends_on:
      - mysql
      - tcapi

  tcapi:
    image: picklewagon/tradingcardapi:${DOCKER_TAG_TCAPI:-latest}
    volumes:
      - ./.docker/storage/api/storage:/var/www/app/storage
      - ./.docker/scripts/laravel.sh:/var/www/app/.docker/init.d/01-init.sh
      - ./.docker/api/local.provision-api.sh:/var/www/app/.docker/init.d/02-init.sh
      # Long bind-mount syntax with create_host_path: false, so a missing cert
      # fails fast with "path does not exist" instead of Docker silently
      # creating a directory at the source path. Run `make certs` (or any
      # `make up*-full` target, which depends on it) first (#425).
      - type: bind
        source: ./.docker/api/api.tradingcardapi.dev.crt
        target: /etc/nginx/ssl/cert.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.docker/api/api.tradingcardapi.dev.key
        target: /etc/nginx/ssl/key.pem
        read_only: true
        bind:
          create_host_path: false
      - ./.docker/api/nginx-site-dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${TCAPI_PORT_HTTP:-8243}:443"
    depends_on:
      - mysql
    networks:
      - overlay
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "https://api.tradingcardapi.dev:${TCAPI_PORT_HTTP:-8243}"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tradingcards
      DB_USERNAME: root
      DB_PASSWORD: password
    healthcheck:
      test: curl -fk https://localhost/ping
      interval: 1m
      timeout: 3s
      retries: 30
      start_period: 30s

  admin:
    image: picklewagon/tradingcardapi-admin:${DOCKER_TAG_ADMIN:-latest}
    volumes:
      - ./.docker/storage/admin/storage:/var/www/app/storage
      - ./.docker/admin/local.provision-admin.sh:/var/www/app/.docker/init.d/01-init.sh
      # Long bind-mount syntax with create_host_path: false, so a missing cert
      # fails fast with "path does not exist" instead of Docker silently
      # creating a directory at the source path. Run `make certs` (or any
      # `make up*-full` target, which depends on it) first (#425).
      - type: bind
        source: ./.docker/admin/admin.tradingcardapi.dev.crt
        target: /etc/nginx/ssl/cert.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.docker/admin/admin.tradingcardapi.dev.key
        target: /etc/nginx/ssl/key.pem
        read_only: true
        bind:
          create_host_path: false
      - ./.docker/admin/nginx-site-dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${ADMIN_PORT_HTTPS:-8480}:443"
    depends_on:
      - mysql
      - tcapi
    networks:
      - overlay
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_LOG_LEVEL: debug
      APP_URL: "http://localhost"
      LOG_CHANNEL: errorlog
      DB_HOST: mysql
      DB_DATABASE: tradingcards
      DB_USERNAME: tcms
      DB_PASSWORD: password
      BROADCAST_DRIVER: log
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_DRIVER: database
      APP_ENABLE_REGISTRATION: "true"
      MAIL_DRIVER: "${MAIL_DRIVER:-log}"
      MAILGUN_DOMAIN: "${MAILGUN_DOMAIN:-}"
      MAILGUN_SECRET: "${MAILGUN_SECRET:-}"
      TRADINGCARDAPI_CLIENT_ID: ${TRADINGCARDAPI_CLIENT_ID}
      TRADINGCARDAPI_CLIENT_SECRET: ${TRADINGCARDAPI_CLIENT_SECRET}
    healthcheck:
      test: curl -fk https://localhost/ping
      interval: 1m
      timeout: 3s
      retries: 30
      start_period: 30s
