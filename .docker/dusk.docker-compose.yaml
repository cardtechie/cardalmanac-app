version: '3.7'

services:
    admin:
        build:
            context: ../
        image: picklewagon/tradingcardapi-admin:${DOCKER_TAG_ADMIN:-latest}
        volumes:
            # Mount the build directory to get unit test results easily
            - ../tests/Browser:/var/www/app/tests/Browser
            - ../.docker/scripts/laravel.sh:/var/www/app/.docker/init.d/01-init.sh
            - ../build:/var/www/app/build
            - ../.docker/cert/admin.tradingcardapi.dev.crt:/etc/nginx/ssl/cert.crt
            - ../.docker/cert/admin.tradingcardapi.dev.key:/etc/nginx/ssl/key.pem
            - ../.docker/config/nginx-site-dev.conf:/etc/nginx/conf.d/default.conf
        entrypoint: /var/www/app/.docker/scripts/dusk.entrypoint.sh
        command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
        env_file:
            - ../.env.local
        ports:
            - "${DUSK_PORT_HTTPS:-8480}:443"
        depends_on:
            - selenium
            - mysql
        networks:
            - dusktestsnw
        environment:
            APP_ENV: testing
            APP_URL: http://admin
            DB_CONNECTION: mysql
            #DB_CONNECTION: sqlite
            #DB_DATABASE: /var/www/app/storage/dusk/storage/database.sqlite
            TRADINGCARDAPI_CLIENT_ID: f7f56039-caca-427f-858f-7c5d7b2c62ef
            TRADINGCARDAPI_CLIENT_SECRET: YiCYNtvgnodjfXocluizBDObkhjJOmXyDjj0VIX5

    tcapi:
        image: picklewagon/tradingcardapi:${DOCKER_TAG_TCAPI:-latest}
        volumes:
            - ../.docker/storage/api/storage:/var/www/app/storage
            - ../.docker/scripts/laravel.sh:/var/www/app/.docker/init.d/01-init.sh
            - ../.docker/scripts/local.provision-api.sh:/var/www/app/.docker/init.d/02-init.sh
            - ../.docker/scripts/dusk-api.entrypoint.sh:/var/www/app/.docker/scripts/dusk-api.entrypoint.sh
        entrypoint: /var/www/app/.docker/scripts/dusk-api.entrypoint.sh
        command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
        ports:
            - "${TCAPI_PORT_HTTP:-8243}:443"
        depends_on:
            - mysql
        networks:
            - dusktestsnw
        environment:
            APP_ENV: testing
            APP_KEY: "base64:CKrokkohRXTBfUNC1Pgx/djLJqa1OezzOLXadNz81W8="
            APP_DEBUG: "true"
            APP_URL: "https://api.tradingcardapi.dev:${TCAPI_PORT_HTTP:-8243}"
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: tradingcards
            DB_USERNAME: root
            DB_PASSWORD: password
            TRADINGCARDAPI_CLIENT_ID: f7f56039-caca-427f-858f-7c5d7b2c62ef
            TRADINGCARDAPI_CLIENT_SECRET: YiCYNtvgnodjfXocluizBDObkhjJOmXyDjj0VIX5

        healthcheck:
            test: curl -fk https://localhost/ping
            interval: 5m
            timeout: 3s
            retries: 30
            start_period: 30s

    selenium:
        image: selenium/standalone-chrome
        ports:
            - "${DOCKER_PORT_DUSK:-4444}:4444"
        volumes:
            - ../:/var/www/app
        networks:
            - dusktestsnw

    mysql:
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        volumes:
            - ../.docker/mysql:/docker-entrypoint-initdb.d
        ports:
            - "${DOCKER_PORT_MYSQL:-13306}:3306"
        networks:
            - dusktestsnw
        environment:
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
        healthcheck:
            test: mysqladmin -u${DB_USERNAME:-root} -p${DB_PASSWORD:-password} ping
            interval: 5s
            timeout: 10s
            retries: 30

networks:
    dusktestsnw:
