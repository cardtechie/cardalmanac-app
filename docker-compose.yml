version: '3.7'

services:

    caapp:
        build:
            context: ./
        image: picklewagon/cardalmanac-app:${DOCKER_TAG_CAAPP:-latest}
        env_file:
            - ./.env.local
        environment:
            TRADINGCARDAPI_CLIENT_ID: "${TRADINGCARDAPI_CLIENT_ID}"
            TRADINGCARDAPI_CLIENT_SECRET: "${TRADINGCARDAPI_CLIENT_SECRET}"
            MIX_SENDINBLUE_API_KEY: "${MIX_SENDINBLUE_API_KEY}"
        working_dir: /var/www/app
        volumes:
            - .:/var/www/app:consistent
            - ./.docker/config/local.supervisord-watch.conf:/etc/supervisor/conf.d/watch.conf
            - ./.docker/scripts/local.provision-packages.sh:/var/www/app/.docker/init.d/01-init.sh
            - ./.docker/scripts/local.provision-database.sh:/var/www/app/.docker/init.d/02-init.sh
            - ./.docker/scripts/local.provision-wordpress.sh:/var/www/app/.docker/init.d/03-init.sh
            - ./.docker/cert/cardalmanac.dev.crt:/etc/nginx/ssl/cert.crt
            - ./.docker/cert/cardalmanac.dev.key:/etc/nginx/ssl/key.pem
            - ./.docker/config/nginx-site-dev.conf:/etc/nginx/conf.d/default.conf
        entrypoint: /var/www/app/.docker/scripts/local.entrypoint.sh
        command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
        ports:
            - "${ADMIN_PORT_HTTP:-8580}:80"
            - "${ADMIN_PORT_HTTPS:-8543}:443"
            - "${ADMIN_PORT_DEBUG:-9001}:9001"
        depends_on:
            - mysql
        networks:
            - overlay
        healthcheck:
            test: curl -fk https://localhost/ping
            interval: 1m
            timeout: 3s
            retries: 30
            start_period: 30s

    tcapi:
        image: picklewagon/tradingcardapi:${DOCKER_TAG_TCAPI:-latest}
        volumes:
            - ./.docker/storage/api/storage:/var/www/app/storage
            - ./.docker/scripts/laravel.sh:/var/www/app/.docker/init.d/01-init.sh
            - ./.docker/scripts/local.provision-api.sh:/var/www/app/.docker/init.d/02-init.sh
        ports:
            - "${TCAPI_PORT_HTTP:-8243}:443"
        depends_on:
            - mysql
        networks:
            - overlay
        environment:
            APP_ENV: local
            APP_KEY: "***REMOVED***"
            APP_DEBUG: "true"
            APP_URL: "https://api.tradingcardapi.dev:${TCAPI_PORT_HTTP:-8243}"
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: tradingcards
            DB_USERNAME: root
            DB_PASSWORD: password
        healthcheck:
            test: curl -fk https://localhost/ping
            interval: 1m
            timeout: 3s
            retries: 30
            start_period: 30s

    mysql:
        image: mysql:8.0
        #command: --default-authentication-plugin=mysql_native_password --sql-require-primary-key=ON
        command: --default-authentication-plugin=mysql_native_password
        volumes:
            - "${DOCKER_VOLUME_MYSQL_STORAGE:-./.docker/storage/db/}:/var/lib/mysql"
            - ./.docker/mysql:/docker-entrypoint-initdb.d
        ports:
            - "${DOCKER_PORT_MYSQL:-13305}:3306"
        networks:
            - overlay
        environment:
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
        healthcheck:
            test: mysqladmin -u${DB_USERNAME:-root} -p${DB_PASSWORD:-password} ping
            interval: 5s
            timeout: 10s
            retries: 30

networks:
    overlay:
