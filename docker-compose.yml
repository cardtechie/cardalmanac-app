services:
    caapp:
        build:
            context: ./
            # Local development needs the full toolchain, Xdebug and the
            # /var/www/{vendor,node_modules} layout that
            # .docker/scripts/local.provision-packages.sh rsyncs from.
            target: dev
            secrets:
                - composer_token
        image: picklewagon/cardalmanac-app:${DOCKER_TAG_CAAPP:-latest}
        env_file:
            - ./.env.local
        environment:
            # `environment:` overrides `env_file: ./.env.local`, so a key pinned in the
            # untracked root `.env` wins; unset stays empty so ensure-app-key.sh still
            # generates an ephemeral one (#502).
            APP_KEY: "${APP_KEY:-}"
            TRADINGCARDAPI_URL: "https://host.docker.internal:8243"
            TRADINGCARDAPI_CLIENT_ID: "${TRADINGCARDAPI_CLIENT_ID}"
            TRADINGCARDAPI_CLIENT_SECRET: "${TRADINGCARDAPI_CLIENT_SECRET}"
            BREVO_API_KEY: "${BREVO_API_KEY}"
        working_dir: /var/www/app
        volumes:
            - .:/var/www/app:consistent
            - ./.docker/config/local.supervisord-watch.conf:/etc/supervisor/conf.d/watch.conf
            - ./.docker/scripts/local.provision-packages.sh:/var/www/app/.docker/init.d/01-init.sh
            - ./.docker/scripts/local.provision-database.sh:/var/www/app/.docker/init.d/02-init.sh
            - ./.docker/cert/cardalmanac.dev.crt:/etc/nginx/ssl/cert.crt
            - ./.docker/cert/cardalmanac.dev.key:/etc/nginx/ssl/key.pem
            - ./.docker/config/nginx-site-dev.conf:/etc/nginx/conf.d/default.conf
        entrypoint: /var/www/app/.docker/scripts/local.entrypoint.sh
        command:
            [
                "/usr/bin/supervisord",
                "-n",
                "-c",
                "/etc/supervisor/conf.d/supervisord.conf",
            ]
        ports:
            - "${CAAPP_PORT_HTTP:-8540}:80"
            - "${CAAPP_PORT_HTTPS:-8541}:443"
        depends_on:
            - mysql
        networks:
            - overlay
        healthcheck:
            test: curl -fk -4 https://localhost/ping
            interval: 1m
            timeout: 3s
            retries: 30
            start_period: 30s

    mysql:
        image: mysql:8.0
        #command: --default-authentication-plugin=mysql_native_password --sql-require-primary-key=ON
        command: --default-authentication-plugin=mysql_native_password
        volumes:
            - "${DOCKER_VOLUME_MYSQL_STORAGE:-./.docker/storage/db/}:/var/lib/mysql"
            - ./.docker/mysql:/docker-entrypoint-initdb.d
        ports:
            - "${DOCKER_PORT_MYSQL:-13307}:3306"
        networks:
            - overlay
        environment:
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
        healthcheck:
            test: mysqladmin -u${DB_USERNAME:-root} -p${DB_PASSWORD:-password} ping
            interval: 5s
            timeout: 10s
            retries: 30

networks:
    overlay:

secrets:
    # Passed to `composer config github-oauth.github.com` inside the build and
    # never written to a layer, so it cannot leak through `docker history`.
    # Optional: the build succeeds without it, at the cost of anonymous GitHub
    # API rate limits on the two VCS repositories in composer.json.
    composer_token:
        environment: COMPOSER_TOKEN
